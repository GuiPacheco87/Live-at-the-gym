name: Atualizar academias e estimativas
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -r pipeline/requirements.txt
      - name: Consultar fontes públicas
        run: python pipeline/fetch_sources.py
      - name: Completar localização com IBGE
        run: python pipeline/geography.py
      - name: Importar diretório público Smart Fit
        run: python pipeline/fetch_smartfit.py
      - name: Importar diretório público Bluefit
        run: python pipeline/fetch_bluefit.py
      - name: Importar bairros brasileiros e completar endereços
        run: python pipeline/neighborhoods.py
      - name: Calcular perfis usando Spark SQL
        run: python pipeline/spark_job.py
      - name: Revalidar convênios cadastrados
        run: python pipeline/refresh_benefits.py
      - name: Gerar banco e dados do site
        run: python pipeline/build.py
      - name: Validar antes de publicar
        run: python -m unittest discover -s tests -v
      - name: Salvar versão atualizada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gyms.db data/kaggle_meta.json data/benefits.json data/neighborhoods.json data/smartfit_catalog.json data/bluefit_catalog.json dist/data.json
          git diff --cached --quiet || git commit -m "Atualiza cadastro e estimativas"
          git push
      - name: Publicar atualização na Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: python pipeline/deploy_hook.py
